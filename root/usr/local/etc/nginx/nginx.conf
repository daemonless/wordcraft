user bsd;
worker_processes auto;
# Logs go to the container's output; /tmp is writable as any user.
error_log stderr;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Serve the .gz files precompressed at build time
    gzip_static on;
    gzip_vary on;

    server {
        listen 80 default_server;
        server_name _;

        root /usr/local/www/app;
        index index.html;

        # Revalidate everything by default (ETag => 304); only hashed assets are immutable
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-cache always;

        # Health check endpoint for container monitoring
        location /daemonless-ping {
            access_log off;
            return 200 "pong";
            add_header Content-Type text/plain;
        }

        # Content-hashed wasm-bindgen output (<app>-web-<hash>.js / _bg.wasm): cache forever.
        # mime.types maps .wasm to application/wasm, which browsers need to stream-compile it.
        location ~ "^/[a-z]+-web-[0-9a-f]{16}(_bg\.wasm|\.js)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # PWA manifest (effectcraft); not in mime.types
        location = /manifest.webmanifest {
            default_type application/manifest+json;
        }

        # Fonts fetched on demand when fonts/manifest.txt exists (photocraft);
        # mime.types knows woff but not ttf/otf
        location /fonts/ {
            types { font/ttf ttf; font/otf otf; font/collection ttc; text/plain txt; }
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
